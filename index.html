<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12365e">
  <title>StB Lernplattform · Klausur 3 Bilanzen</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#12365e;background:#eef3f9}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}.loader{width:min(560px,100%);padding:34px;border:1px solid #c3ccd8;border-radius:18px;background:#fff;box-shadow:0 24px 60px rgba(18,54,94,.14)}.mark{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:15px;background:#12365e;color:#fff;font-weight:800;font-size:20px}.loader h1{margin:22px 0 8px;font-size:clamp(24px,5vw,38px);letter-spacing:-.04em}.loader p{margin:0;color:#526173;line-height:1.55}.bar{height:7px;margin-top:24px;overflow:hidden;border-radius:99px;background:#e5ebf2}.bar::after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#1d6b46;animation:load 1.15s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(138%)}}.error{color:#a8341f;white-space:pre-wrap}
  </style>
</head>
<body>
  <main class="loader" id="loader" aria-live="polite">
    <span class="mark">StB</span>
    <h1>Examenscampus wird geladen</h1>
    <p>Die Lernmodule für Buchführung und Bilanzwesen werden vorbereitet.</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
  <noscript>Diese Lernplattform benötigt JavaScript.</noscript>
  <script>
    (async () => {
      async function unpack(path) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(`Datei konnte nicht geladen werden: ${path} (${response.status})`);
        const bytes = new Uint8Array(await response.arrayBuffer());
        const isGzip = bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
        if (!isGzip) return new TextDecoder("utf-8").decode(bytes);
        if (!("DecompressionStream" in window)) throw new Error("Dieser Browser kann gzip-Dateien nicht entpacken.");
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return new Response(stream).text();
      }

      const [page, styles, data, app] = await Promise.all([
        unpack("source/index.html.gz"),
        unpack("source/assets/styles.css.gz"),
        unpack("source/data/bilanzen.js.gz"),
        unpack("source/assets/app.js.gz")
      ]);

      const styleUrl = URL.createObjectURL(new Blob([styles], { type: "text/css" }));
      const dataUrl = URL.createObjectURL(new Blob([data], { type: "text/javascript" }));
      const appUrl = URL.createObjectURL(new Blob([app], { type: "text/javascript" }));
      const hydratedPage = page
        .replace("assets/styles.css", styleUrl)
        .replace("data/bilanzen.js", dataUrl)
        .replace("assets/app.js", appUrl);

      document.open();
      document.write(hydratedPage);
      document.close();
    })().catch((error) => {
      const loader = document.getElementById("loader");
      loader.innerHTML = '<span class="mark">StB</span><h1>Die Seite konnte nicht geladen werden</h1><p class="error"></p>';
      loader.querySelector(".error").textContent = error instanceof Error ? error.message : String(error);
      console.error(error);
    });
  </script>
</body>
</html>
