name: Patch Prüfungsschemata

on:
  push:
    branches:
      - content/pruefungsschemata

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'App: Prüfungsschemata einbinden'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/pruefungsschemata
      - name: App patchen
        run: python .github/scripts/patch-pruefungsschemata.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "App: Prüfungsschemata einbinden"
          git push
