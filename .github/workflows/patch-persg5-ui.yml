name: Patch PersG Tag 5 UI labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: patch PersG Tag 5 UI labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Tag-5-Beschriftungen im gemeinsamen PersG-Campus aktualisieren
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/K3PersGCampus.jsx')
          s=p.read_text()
          replacements={
            'Tag 1 bis 4':'Tag 1 bis 5',
            'Unterrichtstage 1–4':'Unterrichtstage 1–5',
            'Unterrichtstage 1 bis 4':'Unterrichtstage 1 bis 5',
            'Lernmodule · Unterrichtstage 1–4':'Lernmodule · Unterrichtstage 1–5',
            'Unterrichtsfälle aus Tag 1 bis 4':'Unterrichtsfälle aus Tag 1 bis 5',
            'Schemata aus vier Unterrichtstagen':'Schemata aus fünf Unterrichtstagen',
            'Training · Tag 1 bis 4':'Training · Tag 1 bis 5',
            'Ende Tag 4':'Ende Tag 5',
            'Die Unterrichtsfälle aus Tag 1 bis 4 sind bereits unter „Originalfälle“ querverschaltet.':'Die Unterrichtsfälle aus Tag 1 bis 5 sind bereits unter „Originalfälle“ querverschaltet.',
            'Vom Mitunternehmerbegriff bis zur <em>§-24-UmwStG-Einbringung.</em>':'Vom Mitunternehmerbegriff bis zu <em>Austritt, Gesellschafterwechsel und Realteilung.</em>',
            'Tag 4 ergänzt § 24 UmwStG, Brutto-/Nettomethode, Ergänzungsbilanzen, sonstige Gegenleistungen und die Einbringung von Mitunternehmeranteilen.':'Tag 5 ergänzt Austritt und Abfindung, Gesellschafterwechsel mit Ergänzungsbilanz sowie echte/unechte Realteilung einschließlich Sperrfrist und Ausgleichszahlung.',
            'Quellenstand: Unterrichtstage 1–4 bis 06.08.2026 · Begleitfassungen Tag 3 und Tag 4 lückenlos erfasst.':'Quellenstand: Unterrichtstage 1–5 · Einheitsfassungen Tag 3, Tag 4 und Tag 5 lückenlos erfasst; Tag 5 umfasst 487/487 physische Seiten.'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/K3PersGCampus.jsx
          git commit -m "K3 PersG: Campus auf Tag 5 aktualisieren" || true
          git push
