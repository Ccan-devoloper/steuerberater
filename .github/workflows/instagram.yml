name: Instagram-Bot

# Läuft stündlich (UTC 05:35–20:35 = 07:35–22:35 Sommerzeit bzw. 06:35–21:35 Winterzeit)
# und veröffentlicht alle Beiträge/Stories, deren Uhrzeit im Tagesplan erreicht ist.
on:
  schedule:
    - cron: "35 5-20 * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "live = veröffentlichen · trocken = nur erzeugen und in den Asset-Zweig legen · planen = nur Tagesplan zeigen"
        type: choice
        default: live
        options: [live, trocken, planen]
      alles:
        description: "Alle Einträge des Tages sofort veröffentlichen (Uhrzeiten ignorieren)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/package-lock.json

      - name: Abhängigkeiten
        working-directory: social
        run: npm ci

      - name: Chromium-Cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('social/package-lock.json') }}

      - name: Chromium installieren
        working-directory: social
        run: npx playwright install --with-deps chromium

      - name: Tageslauf
        working-directory: social
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          IG_STIL: ${{ vars.IG_STIL }}
          IG_WEBSITE: ${{ vars.IG_WEBSITE }}
          IG_MARKE: ${{ vars.IG_MARKE }}
          IG_EXAMEN_DATUM: ${{ vars.IG_EXAMEN_DATUM }}
          IG_EXAMEN_ENDE: ${{ vars.IG_EXAMEN_ENDE }}
          IG_DRY_RUN: ${{ github.event.inputs.modus == 'trocken' && 'true' || 'false' }}
          GIT_AUTHOR_NAME: instagram-bot
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.modus }}" = "planen" ]; then ARGS="--nur-planen"; fi
          if [ "${{ github.event.inputs.alles }}" = "true" ]; then ARGS="$ARGS --alles"; fi
          node src/lauf.mjs $ARGS

      - name: Ausgaben sichern (bei Fehlern zur Diagnose)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-ausgabe-${{ github.run_id }}
          path: social/out
          if-no-files-found: ignore
          retention-days: 7
