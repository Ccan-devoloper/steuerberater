name: Instagram-Bot

# Läuft stündlich (UTC 05:35–20:35 = 07:35–22:35 Sommerzeit bzw. 06:35–21:35 Winterzeit)
# und veröffentlicht alle Beiträge/Stories, deren Uhrzeit im Tagesplan erreicht ist.
# Hinweis: GitHub registriert den Zeitplan erst, wenn diese Datei auf dem
# Standardzweig geändert wurde; ein Lauf ist idempotent (nur fällige Einträge).
on:
  schedule:
    - cron: "35 5-20 * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "trocken = nur erzeugen und in den Asset-Zweig legen · live = veröffentlichen · planen = nur Tagesplan zeigen"
        type: choice
        default: trocken
        options: [trocken, live, planen]
      alles:
        description: "Alle Einträge des Tages sofort veröffentlichen (Uhrzeiten ignorieren)"
        type: boolean
        default: false
      auffuellen:
        description: "Feed auffüllen: so viele Beiträge am Stück veröffentlichen (nur Beiträge, keine Reels/Stories; setzt bei Abbruch fort)"
        type: string
        default: ""
      wecker:
        description: "Intern: Lauf gehört zur Weckkette (löst den nächsten Lauf selbst aus)"
        type: boolean
        default: false
      nur_wecken:
        description: "Intern: nichts veröffentlichen, nur die Weckkette fortsetzen"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  posten:
    if: github.event.inputs.nur_wecken != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Nur ein veröffentlichender Lauf zur Zeit – die Weckkette (Job unten) hält
    # die Gruppe nicht, damit Zeitplan und Kette sich nicht gegenseitig blockieren.
    concurrency:
      group: instagram-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/package-lock.json

      - name: Abhängigkeiten
        working-directory: social
        run: npm ci

      - name: Chromium-Cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('social/package-lock.json') }}

      - name: Chromium installieren
        working-directory: social
        run: npx playwright install --with-deps chromium

      # Kostenlose Offline-Stimme für Reels (Piper „Thorsten“, neuronal). Wird nur
      # gebraucht, wenn kein ElevenLabs-Schlüssel gesetzt ist; kostet sonst nichts.
      - name: Piper-Stimme (Cache)
        id: piper-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper-voices
          key: piper-voice-de_DE-thorsten-high-v1

      - name: ffmpeg und Piper installieren
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -version | head -1
          pip install --quiet piper-tts
          if [ ! -f ~/.cache/piper-voices/de_DE-thorsten-high.onnx ]; then
            mkdir -p ~/.cache/piper-voices
            python3 -m piper.download_voices --data-dir ~/.cache/piper-voices de_DE-thorsten-high
          fi
          ls -la ~/.cache/piper-voices

      - name: Tageslauf
        working-directory: social
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          IG_REELS: ${{ vars.IG_REELS }}
          IG_STIMME: ${{ vars.IG_STIMME }}
          IG_SCHLUESSELWORT: ${{ vars.IG_SCHLUESSELWORT }}
          IG_FAKTENCHECK: ${{ vars.IG_FAKTENCHECK }}
          IG_LERNEN: ${{ vars.IG_LERNEN }}
          IG_NACHRICHTEN: ${{ vars.IG_NACHRICHTEN }}
          BERICHT_EMAIL: ${{ vars.BERICHT_EMAIL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_PERSON_URN: ${{ vars.LI_PERSON_URN }}
          PIPER_VOICES_DIR: /home/runner/.cache/piper-voices
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          IG_STIL: ${{ vars.IG_STIL }}
          IG_WEBSITE: ${{ vars.IG_WEBSITE }}
          IG_MARKE: ${{ vars.IG_MARKE }}
          IG_EXAMEN_DATUM: ${{ vars.IG_EXAMEN_DATUM }}
          IG_EXAMEN_ENDE: ${{ vars.IG_EXAMEN_ENDE }}
          # Manuell: nur „live“ veröffentlicht. Zeitplan: live, außer die Variable IG_PAUSE ist auf true.
          IG_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.modus != 'live') || vars.IG_PAUSE == 'true' }}
          GIT_AUTHOR_NAME: instagram-bot
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.modus }}" = "planen" ]; then ARGS="--nur-planen"; fi
          if [ "${{ github.event.inputs.alles }}" = "true" ]; then ARGS="$ARGS --alles"; fi
          if [ -n "${{ github.event.inputs.auffuellen }}" ]; then ARGS="$ARGS --auffuellen=${{ github.event.inputs.auffuellen }}"; fi
          node src/lauf.mjs $ARGS

      - name: Ausgaben sichern (bei Fehlern zur Diagnose)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-ausgabe-${{ github.run_id }}
          path: social/out
          if-no-files-found: ignore
          retention-days: 7

  # Weckkette: GitHub löst „schedule“ nicht zuverlässig aus (Läufe fehlen oder
  # kommen Stunden später). Deshalb wartet nach jedem planmäßigen Lauf ein
  # kleiner Job bis kurz nach dem nächsten Slot (Minute 35, 05–20 UTC) und
  # startet den Lauf selbst, falls GitHub ihn nicht gestartet hat. Kommt der
  # Zeitplan doch, übernimmt dessen Lauf die Kette – es lebt immer genau eine.
  weckruf:
    needs: posten
    if: always() && (github.event_name == 'schedule' || github.event.inputs.wecker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Bis zum nächsten Slot warten, dann nachsehen und ggf. wecken
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          jetzt=$(date -u +%s)
          # Nächster Slot: heute Minute 35 der nächsten vollen Stunde zwischen 05 und 20 UTC, sonst morgen 05:35.
          h=$((10#$(date -u +%H))); m=$((10#$(date -u +%M)))
          tag=$(date -u +%F)
          if [ $m -lt 35 ]; then zielh=$h; else zielh=$((h+1)); fi
          if [ $zielh -lt 5 ]; then zielh=5; fi
          if [ $zielh -gt 20 ]; then zielh=5; tag=$(date -u -d "$tag +1 day" +%F); fi
          slot=$(date -u -d "$tag $(printf %02d $zielh):35:00" +%s)
          warten=$((slot + 420 - jetzt))
          echo "Nächster Slot: $(date -u -d @$slot +%FT%TZ) – warte $warten s"
          if [ $warten -gt 19800 ]; then
            # Länger als 5,5 h (Nachtpause): zwischendurch einmal nur die Kette weiterreichen.
            sleep 19800
            gh workflow run instagram.yml -f modus=live -f wecker=true -f nur_wecken=true
            exit 0
          fi
          [ $warten -gt 0 ] && sleep $warten
          seit=$(date -u -d @$slot +%FT%TZ)
          n=$(gh api "repos/$GH_REPO/actions/runs?created=>=$seit&per_page=20" --jq '[.workflow_runs[] | select(.path == ".github/workflows/instagram.yml")] | length')
          echo "Läufe seit $seit: $n"
          if [ "$n" = "0" ]; then
            echo "Zeitplan hat nicht ausgelöst – wecke selbst."
            gh workflow run instagram.yml -f modus=live -f wecker=true
          else
            echo "Zeitplan hat ausgelöst – dieser Lauf übernimmt die Kette."
          fi
