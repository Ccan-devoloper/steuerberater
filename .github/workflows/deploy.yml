name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run check:k1-ao-einheit-1
      - run: npm run check:k1-ao-einheit-2
      - run: npm run check:k1-ao-einheit-3
      - run: npm run check:k1-ao-einheit-4
      - run: npm run check:k1-ao-einheit-5
      - run: npm run check:k1-ao-einheit-6
      - run: npm run check:k1-ao-einheit-7
      - run: npm run check:k1-ao-einheit-8
      - run: npm run check:k1-ao-shortskript-2025
      - run: npm run check:k1-ao-hausaufgaben
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Erfolgreichen Deploy auf main protokollieren
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Deploy-Status schreiben
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          git pull --rebase origin main
          cat > .github/deploy-last.json <<EOF
          {
            "deployed_sha": "${DEPLOYED_SHA}",
            "status": "success",
            "page_url": "${PAGE_URL}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/deploy-last.json
          git commit -m "ci: Pages-Deploy ${DEPLOYED_SHA}" || true
          git push
