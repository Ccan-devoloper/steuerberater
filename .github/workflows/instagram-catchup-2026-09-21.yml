name: Instagram Catch-up Kick 2026-09-21

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instagram-catchup-2026-09-21.yml"

permissions:
  contents: read
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Start live catch-up run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run instagram.yml --ref main -f modus=live
