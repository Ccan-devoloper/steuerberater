name: Vorproduktion · Examenscampus · 25 Sep 2026

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vorproduktion-einmalig-2026-09-26-28.yml"

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  vorproduktion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      IG_STIL: "bunt"
      IG_FARBE_JE_KLAUSUR: "true"
      IG_BILDER: "false"
      IG_BILD_KI: "false"
      IG_CHARAKTERE: "false"
      IG_CHARAKTER_QA: "false"
      IG_STIMME: "piper"
      IG_REEL_LAYOUT: "erklaer"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ELEVENLABS_API_KEY: ""
      PEXELS_API_KEY: ""
      ELEVENLABS_VOICE_ID: ""
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      PIPER_VOICES_DIR: /home/runner/.cache/piper-voices

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/package-lock.json

      - name: Abhängigkeiten
        working-directory: social
        run: npm ci

      - name: ffmpeg
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Chromium
        working-directory: social
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Piper offline
        run: |
          pip install --quiet piper-tts
          mkdir -p ~/.cache/piper-voices
          if [ ! -f ~/.cache/piper-voices/de_DE-thorsten-high.onnx ]; then
            python3 -m piper.download_voices --data-dir ~/.cache/piper-voices de_DE-thorsten-high
          fi

      - name: Providerfreie Vorproduktion vorbereiten
        working-directory: social
        run: node bin/vorproduktion-vorbereiten.mjs 2026-09-25

      - name: Ohne Coverbilder rendern
        working-directory: social
        run: node bin/vorproduktion-ohne-coverbilder-rendern.mjs 2026-09-25

      - name: Review-Dateien sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: examenscampus-vorproduktion-2026-09-25
          path: .instagram-assets/vorproduktion/2026-09-25/fertig/**/*
          if-no-files-found: ignore
          retention-days: 7
