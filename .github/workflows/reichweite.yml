name: Reichweiten-Vorschläge · Examenscampus

on:
  schedule:
    - cron: "17 6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reichweite-examenscampus
  cancel-in-progress: true

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Posts finden und verschlüsseln
        working-directory: social
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          REICHWEITE_KANAL: examenscampus
          REICHWEITE_OUT: ${{ github.workspace }}/out/reichweite.enc.json
        run: node reichweite/sammeln.mjs
      - name: Verschlüsselten Datenblock aktualisieren
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin reichweite-data
          rm -rf /tmp/reichweite-data
          git worktree add --detach /tmp/reichweite-data origin/reichweite-data
          cd /tmp/reichweite-data
          git switch -C reichweite-data origin/reichweite-data
          mkdir -p reichweite
          cp "$GITHUB_WORKSPACE/out/reichweite.enc.json" reichweite/data.enc.json
          git add reichweite/data.enc.json
          git commit -m "data: Reichweiten-Vorschläge $(date -u +%F-%H%M)" || exit 0
          git push origin HEAD:reichweite-data
