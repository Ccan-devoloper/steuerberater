name: QA · Vorproduktion 25–28 Sep 2026 Pixelcheck

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vorproduktion-rerender-qa-2026-09-25-28.yml"

permissions:
  contents: read

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - name: Instagram-Assets auschecken
        uses: actions/checkout@v4
        with:
          ref: instagram-assets
          path: assets

      - name: Neu gerenderte Reviewtage packen
        uses: actions/upload-artifact@v4
        with:
          name: examenscampus-vorproduktion-pixelcheck-2026-09-25-28
          path: |
            assets/vorproduktion/2026-09-25/fertig
            assets/vorproduktion/2026-09-26/fertig
            assets/vorproduktion/2026-09-27/fertig
            assets/vorproduktion/2026-09-28/fertig
          if-no-files-found: error
          retention-days: 1
