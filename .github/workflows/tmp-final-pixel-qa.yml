name: QA · Finaler Pixelcheck 25–28 Sep 2026

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-final-pixel-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Main auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instagram-Assets auschecken
        uses: actions/checkout@v4
        with:
          ref: instagram-assets
          path: assets

      - name: Pillow und ffmpeg
        run: |
          python3 -m pip install --quiet pillow
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Kontaktbögen und Reel-Frames erzeugen
        run: |
          mkdir -p qa/reel-frames
          for d in 2026-09-25 2026-09-26 2026-09-27 2026-09-28; do
            mp4="assets/vorproduktion/$d/fertig/b2/$d-b2.mp4"
            if [ -f "$mp4" ]; then
              dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$mp4")
              for n in 1 2 3; do
                t=$(awk -v d="$dur" -v n="$n" 'BEGIN { t=d*n/4; if (t<0.1) t=0.1; print t }')
                ffmpeg -loglevel error -y -ss "$t" -i "$mp4" -frames:v 1 "qa/reel-frames/$d-reel-$n.jpg"
              done
            fi
          done
          python3 tools/tmp_pixel_qa.py

      - name: QA-Bilder hochladen
        uses: actions/upload-artifact@v4
        with:
          name: examenscampus-final-pixel-qa
          path: qa/*.jpg
          if-no-files-found: error
          retention-days: 1
