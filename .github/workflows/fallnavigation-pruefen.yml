name: Fallnavigation prüfen

on:
  push:
    branches:
      - agent/fallnavigation-menu
    paths:
      - '.github/workflows/fallnavigation-pruefen.yml'
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fallnavigation-menu
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fallnavigation einbauen
        run: node tools/fallnavigation-einbauen.mjs
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Fallsammlung und Navigation prüfen
        run: npm run check:fallsammlung
      - name: Produktionsbuild
        run: npm run build
      - name: Geprüften Stand festschreiben
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen festzuschreiben."
            exit 0
          fi
          git commit -m "Fallnavigation über das Menü ergänzen"
          git push origin HEAD:agent/fallnavigation-menu
