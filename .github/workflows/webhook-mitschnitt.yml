name: Webhook-Mitschnitt

# Nimmt die Rohereignisse entgegen, die der Cloudflare-Worker weiterreicht,
# und haengt sie im Asset-Zweig an state/webhook-roh.jsonl an.
#
# Warum nicht direkt in eine Datenbank? Weil der Bot seinen Zustand ohnehin
# im Asset-Zweig fuehrt: versioniert, lesbar, ohne weiteren Dienst, der Geld
# kosten oder ausfallen kann. Und weil die Frage, die hier beantwortet wird,
# eine einmalige ist - was schickt Meta bei einer Story-Antwort wirklich?
#
# Es wird NICHTS beantwortet. Reiner Mitschnitt.

on:
  repository_dispatch:
    types: [instagram-webhook]

permissions:
  contents: write

concurrency:
  group: webhook-mitschnitt
  cancel-in-progress: false

jobs:
  mitschneiden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instagram-assets
          fetch-depth: 1

      - name: Rohereignis anhängen
        env:
          ROH: ${{ github.event.client_payload.roh }}
          EMPFANGEN: ${{ github.event.client_payload.empfangen }}
        run: |
          set -euo pipefail
          mkdir -p state
          # Base64 zurueck in JSON, eine Zeile je Ereignis (JSONL).
          python3 - <<'PY'
          import base64, json, os, pathlib
          roh = base64.b64decode(os.environ["ROH"])
          try:
              daten = json.loads(roh)
          except Exception as e:
              daten = {"_nicht_lesbar": str(e), "_text": roh.decode("utf-8", "replace")[:4000]}
          zeile = json.dumps({"empfangen": os.environ.get("EMPFANGEN", ""), "ereignis": daten}, ensure_ascii=False)
          p = pathlib.Path("state/webhook-roh.jsonl")
          with p.open("a", encoding="utf-8") as f:
              f.write(zeile + "\n")
          print("Mitgeschnitten:", zeile[:400])

          # --------------------------------------------------------------
          # Zuordnungstabelle: Nachrichten-ID -> Story.
          #
          # Das ist der eigentliche Zweck. Der nachtraegliche Abruf ueber
          # /conversations liefert bei einer Story-Antwort ein leeres
          # `reply_to` - im EINGEHENDEN Ereignis steht die Story-ID dagegen
          # drin (am 17.09. mitgeschnitten und belegt). Wer den Bezug haben
          # will, muss ihn hier festhalten; spaeter ist er weg.
          # --------------------------------------------------------------
          import time
          bp = pathlib.Path("state/story-bezug.json")
          try:
              bezug = json.loads(bp.read_text(encoding="utf-8")) if bp.exists() else {}
              if not isinstance(bezug, dict):
                  bezug = {}
          except Exception:
              bezug = {}

          neu = 0
          for eintrag in (daten.get("entry") or []):
              for m in (eintrag.get("messaging") or []):
                  nachricht = m.get("message") or {}
                  story = ((nachricht.get("reply_to") or {}).get("story")) or {}
                  mid = nachricht.get("mid")
                  if not story.get("id") or not mid:
                      continue
                  bezug[mid] = {
                      "storyId": str(story["id"]),
                      "url": story.get("url", "")[:400],
                      "absender": str((m.get("sender") or {}).get("id") or ""),
                      "konto": str(eintrag.get("id") or ""),
                      # Wortlaut als Zweitschluessel, falls der Abruf eine
                      # andere Nachrichten-ID fuehrt als das Ereignis.
                      "text": (nachricht.get("text") or "")[:300],
                      "zeit": int(m.get("timestamp") or eintrag.get("time") or time.time() * 1000),
                  }
                  neu += 1

          # Aufraeumen: Instagram nimmt nach 24 Stunden keine Antwort mehr an,
          # aelteres ist also wertlos. 48 Stunden Puffer, hoechstens 500
          # Eintraege - die Datei soll nicht unbemerkt wachsen.
          grenze = time.time() * 1000 - 48 * 3600 * 1000
          bezug = {k: v for k, v in bezug.items() if float(v.get("zeit") or 0) >= grenze}
          if len(bezug) > 500:
              bezug = dict(sorted(bezug.items(), key=lambda kv: -float(kv[1].get("zeit") or 0))[:500])
          bp.write_text(json.dumps(bezug, ensure_ascii=False, indent=1), encoding="utf-8")
          print(f"Story-Zuordnung: {neu} neu, {len(bezug)} gespeichert")
          PY

      - name: Ablegen
        run: |
          set -euo pipefail
          git config user.name instagram-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/webhook-roh.jsonl state/story-bezug.json
          git commit -m "Webhook-Mitschnitt $(date -u +%FT%TZ)" || { echo "nichts Neues"; exit 0; }
          # Mehrere Ereignisse koennen gleichzeitig ankommen - deshalb erst
          # nachziehen, dann schieben.
          for i in 1 2 3 4; do
            git pull --rebase origin instagram-assets && git push origin HEAD:instagram-assets && exit 0
            sleep $((i * 3))
          done
          exit 1
