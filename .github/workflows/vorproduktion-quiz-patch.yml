name: Vorproduktion · Quiz-Patch Examenscampus

# Trägt Quiz-Optionen in bereits vorproduzierte Frage-/Antwort-Stories ein und
# rendert nur diese beiden Stories neu (vorproduktion/quiz-patch.trigger).
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "vorproduktion/quiz-patch.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-bot
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IG_WISSEN_KEY: ${{ secrets.IG_WISSEN_KEY }}
      IG_STIL: "bunt"
      IG_FARBE_JE_KLAUSUR: "true"
      IG_BILDER: "false"
      IG_BILD_KI: "false"
      IG_CHARAKTERE: "false"
      IG_CHARAKTER_QA: "false"
      IG_STIMME: "piper"
      IG_REEL_LAYOUT: "erklaer"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ELEVENLABS_API_KEY: ""
      PEXELS_API_KEY: ""
      ELEVENLABS_VOICE_ID: ""
      GIT_AUTHOR_NAME: instagram-bot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      PIPER_VOICES_DIR: /home/runner/.cache/piper-voices

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/package-lock.json

      - name: Abhängigkeiten
        working-directory: social
        run: npm ci

      - name: Linter
        working-directory: social
        run: npm run lint

      - name: Chromium
        working-directory: social
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Quiz-Optionen eintragen und Frage-/Antwort-Stories neu rendern
        working-directory: social
        run: node bin/vorproduktion-quiz-patch.mjs
