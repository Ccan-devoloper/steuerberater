name: Endriss Quellen vorbereiten
on:
  push:
    branches: [codex/endriss-restbestaende-2026-09-29]
    paths:
      - tools/endriss/prepare.py
      - tools/endriss/quellen.tsv
      - .github/workflows/endriss-vorbereitung.yml
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [core, kst, erbst, notes, marks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rendering dependencies
        run: python -m pip install PyMuPDF==1.26.7 Pillow==12.3.0
      - name: Select and prepare source group
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools/endriss')
          from prepare import source_rows
          rows = source_rows(pathlib.Path('tools/endriss/quellen.tsv'))
          def group(row, index):
              if row['id'].startswith('kst-e'): return 'kst'
              if row['id'].startswith('erbst-e'): return 'erbst'
              if index < 24: return 'core'
              if row['art'] in ('zip', 'image'): return 'marks'
              return 'notes'
          chosen = [r['id'] for i, r in enumerate(rows) if group(r, i) == os.environ['GROUP']]
          subprocess.run([sys.executable, 'tools/endriss/prepare.py', '--only', ','.join(chosen), '--workers', '4'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endriss-review-${{ matrix.group }}
          path: /tmp/endriss-review/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
