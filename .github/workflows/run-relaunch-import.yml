name: Run Relaunch Import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-relaunch-import.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Relaunch-Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: relaunch-v3
          path: target

      - name: Archiv rekonstruieren
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chunks /tmp/unpack
          for nummer in 00 01 02 03 04 05 06; do
            head -c 14000 "target/.import/chunk-${nummer}.b64" > "/tmp/chunks/chunk-${nummer}.b64"
          done
          head -c 10008 target/.import/chunk-07.b64 > /tmp/chunks/chunk-07.b64

          cat > /tmp/chunks/SHA256SUMS <<'SUMMEN'
          3b124611f3f6254fa1c2c308bed0b89b6827b619c0465f06d0365b6bbd1a82a0  chunk-00.b64
          07c1ebc17e213e97790c69361af133eb709e5e06daceb31bbcaa534adf7260a4  chunk-01.b64
          fc818bd72a35440bf3fdf773edebedcb23cd1d9b682f811b2ef5277495fd3020  chunk-02.b64
          d82178233d34ad8ea16549a20944b3ecf2cb837cde13bf489fc53b9511c174e7  chunk-03.b64
          b2f5a4fbca6365c53544e8e6ea92d235c6870060e1c575d0ea5a67b46e2049dc  chunk-04.b64
          7460539bdf3f30607bf347943aa744c0f8b0e8105701e13937349e79d6622aa7  chunk-05.b64
          43e1fd6b0dee2a9d4f992ce4f7ce3495e3f9d910b363a71a73ca49acf6620347  chunk-06.b64
          547c12eb08c5c8af0af1d41629fc46af03383533f03f300f4dda5e73c38caaa7  chunk-07.b64
          SUMMEN
          (cd /tmp/chunks && sha256sum -c SHA256SUMS)

          cat /tmp/chunks/chunk-[0-9][0-9].b64 | base64 -d > /tmp/stb-project.tar.xz
          tar -xJf /tmp/stb-project.tar.xz -C /tmp/unpack
          test -f /tmp/unpack/stb-examenscampus/package.json

      - name: Produktionsbuild prüfen
        working-directory: /tmp/unpack/stb-examenscampus
        run: |
          npm ci
          npm run build

      - name: Finalen Stand nach relaunch-v3 schreiben
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/unpack/stb-examenscampus/ target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Relaunch v3: neues Designsystem, 46 Module, 26 Schaubilder, Normenregister, Formelsammlung"
          git push origin HEAD:relaunch-v3
