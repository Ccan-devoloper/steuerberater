name: Endriss Restbestaende
on:
  push:
    branches: [codex/endriss-restbestaende-2026-09-29]
permissions:
  contents: read
concurrency:
  group: endriss-restbestaende
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Source access probe
        run: python3 tools/endriss-source-access.py
      - name: Source snapshot
        run: git archive --format=zip HEAD src tools docs .github package.json package-lock.json vite.config.js index.html > /tmp/endriss-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: endriss-source
          path: /tmp/endriss-source.zip
          retention-days: 7
      - run: npm ci
      - name: Native registry and rendered source content
        run: node tools/pruefen-endriss-native.mjs
      - name: Source-bound Horst version-2 mapping
        run: node tools/pruefen-endriss-horst2.mjs
      - name: Source-bound AO/FGO Notfallbuch mapping
        run: node tools/pruefen-endriss-notfallbuch.mjs
      - name: Local validation dependencies
        run: tar -czf /tmp/endriss-node.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: endriss-node
          path: /tmp/endriss-node.tar.gz
          retention-days: 1
      - run: npm run build
      - name: Source import checks
        run: node tools/pruefen-endriss-nachtrag.mjs
      - name: Preserve resume checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endriss-resume-checkpoint
          path: |
            docs/endriss-fortschritt.json
            docs/endriss-fortsetzung.md
          retention-days: 7
          if-no-files-found: error
