name: Import Relaunch v3

on:
  push:
    branches: [relaunch-v3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Ziel-Repository auschecken
        uses: actions/checkout@v4
        with:
          path: target

      - name: Upload-Repository auschecken
        uses: actions/checkout@v4
        with:
          repository: Ccan-devoloper/stb-upload
          ref: main
          token: ${{ github.token }}
          path: source

      - name: Projektstruktur herstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/src/components staging/src/data staging/.github/workflows

          cp source/.gitignore staging/.gitignore
          cp source/README.md staging/README.md
          cp source/index.html staging/index.html
          cp source/package.json staging/package.json
          cp source/package-lock.json staging/package-lock.json
          cp source/vite.config.js staging/vite.config.js
          cp source/deploy.yml staging/.github/workflows/deploy.yml

          cp source/App.jsx staging/src/App.jsx
          cp source/index.css staging/src/index.css
          cp source/main.jsx staging/src/main.jsx

          cp source/Bausteine.jsx staging/src/components/Bausteine.jsx
          cp source/Icons.jsx staging/src/components/Icons.jsx
          cp source/Schaubild.jsx staging/src/components/Schaubild.jsx

          cp source/module.js staging/src/data/module.js
          cp source/module-basis-a.js staging/src/data/module-basis-a.js
          cp source/module-basis-b.js staging/src/data/module-basis-b.js
          cp source/module-vertiefung-a.js staging/src/data/module-vertiefung-a.js
          cp source/module-vertiefung-b.js staging/src/data/module-vertiefung-b.js
          cp source/modules-faelle.js staging/src/data/modules-faelle.js
          cp source/schaubilder.js staging/src/data/schaubilder.js
          cp source/lernstoff.js staging/src/data/lernstoff.js
          cp source/sources.js staging/src/data/sources.js

      - name: Produktionsbuild prüfen
        working-directory: staging
        run: |
          npm ci
          npm run build

      - name: Finalen Stand committen
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' staging/ target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Relaunch v3: neues Designsystem, 46 Module, 26 Schaubilder, Normenregister, Formelsammlung"
          git push origin HEAD:relaunch-v3
