name: Instagram-Kommentare

# Von Hand: Kommentare unter den letzten Beiträgen lesen oder einen einzelnen
# Kommentar beantworten. Ruft Claude nicht auf und schreibt nichts in den
# Asset-Zweig.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "lesen = Kommentare der letzten Beiträge anzeigen · antworten = einen Kommentar beantworten · dm = dem Verfasser eines Kommentars privat schreiben · kommentieren = eigener Kommentar unter einem Beitrag"
        type: choice
        default: lesen
        options: [lesen, antworten, dm, kommentieren]
      kommentar_id:
        description: "antworten/dm: ID des Kommentars · kommentieren: Medien-ID oder Anfang der Caption"
        type: string
        default: ""
      text:
        description: "Nur für antworten/dm/kommentieren: Text"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  kommentare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/package-lock.json

      - name: Abhängigkeiten
        working-directory: social
        run: npm ci --ignore-scripts

      - name: Kommentare
        working-directory: social
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_NO_PUSH: "true"
          MODUS: ${{ github.event.inputs.modus }}
          KOMMENTAR_ID: ${{ github.event.inputs.kommentar_id }}
          TEXT: ${{ github.event.inputs.text }}
        run: |
          if [ "$MODUS" = "antworten" ] || [ "$MODUS" = "dm" ] || [ "$MODUS" = "kommentieren" ]; then
            node bin/kommentare.mjs "$MODUS" "$KOMMENTAR_ID" "$TEXT"
          else
            node bin/kommentare.mjs lesen 12
          fi
