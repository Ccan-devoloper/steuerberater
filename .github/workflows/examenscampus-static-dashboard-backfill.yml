name: Examenscampus · Dashboard-Backfill statisch

on:
  push:
    branches:
      - codex/examenscampus-static-dashboard-backfill

permissions:
  contents: write

concurrency:
  group: examenscampus-static-dashboard-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IG_ASSET_DIR: .instagram-assets
      IG_STIL: bunt
      IG_FARBE_JE_KLAUSUR: "true"
      IG_BILDER: "false"
      IG_BILD_KI: "false"
      IG_CHARAKTERE: "false"
      IG_CHARAKTER_QA: "false"
      IG_STIMME: piper
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ELEVENLABS_API_KEY: ""
      PEXELS_API_KEY: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/package-lock.json
      - name: Abhängigkeiten und Browser
        working-directory: social
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Statische Dashboard-Medien reparieren
        working-directory: social
        run: |
          node bin/vorproduktion-dashboard-backfill.mjs \
            2026-09-26 2026-09-27 2026-09-28 2026-09-29 2026-09-30 \
            2026-10-01 2026-10-02 2026-10-03 2026-10-04 2026-10-05 \
            2026-10-06 2026-10-07 2026-10-08 2026-10-09 2026-10-10 \
            2026-10-11 2026-10-12 2026-10-13 2026-10-14 2026-10-15 \
            2026-10-16 2026-10-17 2026-10-18 2026-10-19 2026-10-20 \
            2026-10-21 2026-10-22 2026-10-23 2026-10-24 2026-10-25 \
            2026-10-26 2026-10-27 2026-10-28
