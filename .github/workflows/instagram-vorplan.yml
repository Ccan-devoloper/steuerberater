name: Instagram-Tagesplan vorab

# Der Tagesplan muss vor der morgendlichen Chat-Finalisierung vorhanden sein.
# 03:05 UTC = 05:05 MESZ / 04:05 MEZ. Dadurch kann der Plan ab 06:00 Uhr
# deutscher Zeit im Chat geprüft und vollständig befüllt werden.
# Dieser Lauf erzeugt KEINE Texte, Faktenchecks, Bilder oder Veröffentlichungen.
on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  planen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: instagram-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/package-lock.json

      - name: Abhängigkeiten
        working-directory: social
        run: npm ci

      - name: Tagesplan persistent vorbereiten
        working-directory: social
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          IG_REELS: ${{ vars.IG_REELS }}
          IG_REEL_TAGE: ${{ vars.IG_REEL_TAGE }}
          IG_EXAMEN_DATUM: ${{ vars.IG_EXAMEN_DATUM }}
          IG_EXAMEN_ENDE: ${{ vars.IG_EXAMEN_ENDE }}
          IG_MARKE: ${{ vars.IG_MARKE }}
          IG_ABLEGEN: "1"
          GIT_AUTHOR_NAME: instagram-bot
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node src/lauf.mjs --vorplanen
