name: QA · Vorproduktion Visuals 25–28 Sep 2026

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-vorproduktion-visual-qa.yml"

permissions:
  contents: read

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - name: Examenscampus main
        uses: actions/checkout@v4
        with:
          path: exam

      - name: Instagram-Assets
        uses: actions/checkout@v4
        with:
          ref: instagram-assets
          path: assets

      - name: HerrJurist main
        uses: actions/checkout@v4
        with:
          repository: Ccan-devoloper/herrjurist
          path: herr

      - name: Visuals packen
        uses: actions/upload-artifact@v4
        with:
          name: examenscampus-vorproduktion-visual-qa
          path: |
            assets/vorproduktion/2026-09-25/fertig
            assets/vorproduktion/2026-09-26/fertig
            assets/vorproduktion/2026-09-27/fertig
            assets/vorproduktion/2026-09-28/fertig
          if-no-files-found: error
          retention-days: 1

      - name: Quellen für Diff packen
        uses: actions/upload-artifact@v4
        with:
          name: examenscampus-vorproduktion-source-qa
          path: |
            exam/social/src
            exam/social/bin/vorproduktion-ohne-coverbilder-rendern.mjs
            exam/src/data
            herr/src/render.mjs
            herr/src/vorlagen.mjs
            herr/src/reel.mjs
            herr/src/stile.mjs
          if-no-files-found: error
          retention-days: 1
