name: Prepare dashboard preview fix

on:
  push:
    branches: [fix/herrjurist-preview-2026-09-27]
    paths: [.github/workflows/prepare-dashboard-preview-fix.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/herrjurist-preview-2026-09-27
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch only preview eligibility and its status label
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const path = 'public/instagram-dashboard.html';
          let html = fs.readFileSync(path, 'utf8');
          function replaceOnce(from, to) {
            assert.equal(html.split(from).length - 1, 1, 'Expected exactly one patch target: ' + from);
            html = html.replace(from, to);
          }
          const anchor = '  function preproductionMedia(day,date,slot,content){';
          const helper = [
            '  /* Ein erneuter Renderauftrag macht den bereits erzeugten Medienstand',
            '     nicht unsichtbar. Nur die Vorschau wird freigeschaltet; Status,',
            '     Veröffentlichungsfreigaben und Asset-Dateien bleiben unverändert. */',
            '  function preproductionCanPreviewMedia(day){',
            '    var render=day&&day.renderVorschau;',
            '    if(!render||render.status==="fertig")return true;',
            '    return render.status==="erneut-zu-rendern"&&',
            '      typeof render.pfad==="string"&&render.pfad.trim()!==""&&',
            '      Number.isFinite(Date.parse(render.erzeugtAm||""));',
            '  }',
            ''
          ].join('\n');
          replaceOnce(anchor, helper + anchor);
          replaceOnce('if(day&&day.renderVorschau&&day.renderVorschau.status!=="fertig"){', 'if(!preproductionCanPreviewMedia(day)){');
          replaceOnce('if(type==="Carousel"&&slides.length>1&&day.renderVorschau&&day.renderVorschau.status==="fertig"){', 'if(type==="Carousel"&&slides.length>1&&preproductionCanPreviewMedia(day)){');
          replaceOnce('if(day.renderVorschau&&day.renderVorschau.status!=="fertig"){', 'if(!preproductionCanPreviewMedia(day)){');
          replaceOnce(
            `if(day.renderVorschau&&day.renderVorschau.status!=="fertig")chips.push('<span class="preprod-chip">Medien: <b>Render ausstehend</b></span>');`,
            `if(day.renderVorschau&&day.renderVorschau.status!=="fertig")chips.push('<span class="preprod-chip">Medien: <b>'+(preproductionCanPreviewMedia(day)?'Vorhandener Render · Aktualisierung ausstehend':'Render ausstehend')+'</b></span>');`
          );
          fs.writeFileSync(path, html);
          NODE
      - name: Regression tests and whitespace validation
        run: |
          node --test tools/instagram-preproduction-preview.test.mjs
          git diff --check
      - name: Verify all actual media for 2026-09-27 without changing assets
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const date = '2026-09-27';
          const base = 'https://raw.githubusercontent.com/Ccan-devoloper/herrjurist/instagram-assets/vorproduktion/';
          const response = await fetch(base + date + '.json?v=' + Date.now(), { signal: AbortSignal.timeout(30000) });
          assert.ok(response.ok, 'Read day JSON: ' + response.status);
          const day = await response.json();
          assert.equal(day.datum, date);
          assert.ok(['fertig', 'erneut-zu-rendern'].includes(day.renderVorschau?.status));
          assert.equal(day.renderVorschau.pfad, 'vorproduktion/' + date + '/fertig');
          assert.ok(Number.isFinite(Date.parse(day.renderVorschau.erzeugtAm)));
          const paths = [];
          for (const post of day.plan.beitraege) {
            const root = date + '/fertig/' + post.slot + '/' + date + '-' + post.slot;
            if (post.format === 'reel') paths.push(root + '.mp4', root + '-cover.jpg');
            else {
              const slides = day.inhalte[post.slot].folien;
              assert.ok(slides.length > 0);
              slides.forEach((_, i) => paths.push(root + '-' + String(i + 1).padStart(2, '0') + '.jpg'));
            }
          }
          day.plan.stories.forEach((story) => paths.push(date + '/fertig/stories/' + story.slot + '-' + story.art + '.jpg'));
          assert.equal(day.plan.beitraege.length, 3);
          assert.equal(day.plan.stories.length, 9);
          assert.equal(paths.length, 25);
          for (let i = 0; i < paths.length; i += 5) {
            await Promise.all(paths.slice(i, i + 5).map(async (path) => {
              const asset = await fetch(base + path, { method: 'HEAD', signal: AbortSignal.timeout(30000) });
              assert.ok(asset.ok, path + ': HTTP ' + asset.status);
              const type = asset.headers.get('content-type') || '';
              assert.ok(path.endsWith('.mp4') ? /video|octet-stream/.test(type) : /image\/jpeg/.test(type), path + ': ' + type);
            }));
          }
          console.log('LIVE_ASSETS_OK', JSON.stringify({ date, mediaFiles: paths.length, feed: day.plan.beitraege.length, stories: day.plan.stories.length, renderStatusUnchanged: day.renderVorschau.status }));
          NODE
      - name: Save tested patch to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/instagram-dashboard.html
          git commit -m 'fix: show existing preproduction media while an updated render is pending'
          git push origin HEAD:fix/herrjurist-preview-2026-09-27
          git rev-parse HEAD
